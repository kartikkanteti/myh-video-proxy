<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- This meta tag is the key to forcing iOS to send the header -->
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden; }
    iframe { border: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <iframe id="yt-player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
  
  <script>
    // Grab the video ID from the URL parameter and inject it into the iframe
    const params = new URLSearchParams(window.location.search);
    const videoId = params.get('v');
    if (videoId) {
      document.getElementById('yt-player').src = 'https://www.youtube-nocookie.com/embed/' + videoId + '?playsinline=1&enablejsapi=1';
    }
  </script>
</body>
</html>
